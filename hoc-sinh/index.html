<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Kiểm tra từ vựng Tiếng Anh 6</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Be+Vietnam+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f7fc;--paper:#fff;--ink:#1d2b4f;--mute:#5d6b8c;--line:#cfdcf0;--hi:#ffe27a;--pri:#2f5fd0;--pri-t:#fff;--ok:#1f9d63;--okb:#dff5e9;--bad:#d6483d;--badb:#fde4e1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a2e;--paper:#1b2745;--ink:#e8eefc;--mute:#9fb0d6;--line:#33436b;--hi:#c9a92c;--pri:#7ea3ff;--pri-t:#0f1a36;--ok:#55d396;--okb:#18372b;--bad:#ff8379;--badb:#40211f}}
:root[data-theme="dark"]{--bg:#121a2e;--paper:#1b2745;--ink:#e8eefc;--mute:#9fb0d6;--line:#33436b;--hi:#c9a92c;--pri:#7ea3ff;--pri-t:#0f1a36;--ok:#55d396;--okb:#18372b;--bad:#ff8379;--badb:#40211f}
html{scroll-padding-top:env(safe-area-inset-top,0px);color-scheme:light dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.5 "Be Vietnam Pro",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:18px 16px 40px}
h1{font:800 28px/1.1 "Baloo 2",system-ui,sans-serif;margin:0 0 2px}
h1 span{background:linear-gradient(transparent 55%,var(--hi) 55%);padding:0 4px}
.sub{color:var(--mute);margin:0 0 16px;font-size:14px}
select,button,input{font:inherit;color:inherit}
select{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--paper)}
.tabs{display:flex;gap:6px;margin:12px 0 16px;overflow-x:auto}
.tabs button{flex:1;min-width:max-content;padding:9px 12px;border:2px solid var(--line);background:var(--paper);border-radius:10px;cursor:pointer;font-weight:600}
.tabs button[aria-selected=true]{background:var(--pri);color:var(--pri-t);border-color:var(--pri)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--pri);outline-offset:2px}
.card{background:var(--paper);border:2px solid var(--line);border-radius:16px;padding:24px 18px;text-align:center;min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;cursor:pointer;width:100%}
.card .en{font:800 38px/1.1 "Baloo 2",sans-serif;overflow-wrap:anywhere}
.card .vi{font:600 24px/1.2 "Be Vietnam Pro",sans-serif;color:var(--pri)}
.card .hint{color:var(--mute);font-size:14px}
.row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:12px;border-radius:10px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-weight:600}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-t)}
.btn.ok{background:var(--okb);border-color:var(--ok)}
.btn.bad{background:var(--badb);border-color:var(--bad)}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:8px}
.q{font:800 30px/1.15 "Baloo 2",sans-serif;text-align:center;margin:16px 0;overflow-wrap:anywhere}
.opts{display:grid;gap:8px}
.opt{padding:13px 14px;border:2px solid var(--line);background:var(--paper);border-radius:10px;text-align:left;cursor:pointer}
.opt.right{background:var(--okb);border-color:var(--ok)}
.opt.wrong{background:var(--badb);border-color:var(--bad)}
.field{width:100%;padding:13px;border:2px solid var(--line);border-radius:10px;background:var(--paper);font-size:20px;text-align:center}
.fb{min-height:28px;text-align:center;margin-top:10px;font-weight:600}
.bar{height:10px;background:var(--line);border-radius:6px;overflow:hidden;margin:4px 0 14px}
.bar i{display:block;height:100%;background:var(--ok)}
.score{text-align:center;padding:20px 0}
.score b{font:800 56px/1 "Baloo 2",sans-serif}
.err{color:var(--bad)}
.tbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:8px 12px;text-align:center;font-weight:700;margin:0 0 12px}
.tbar.low{background:var(--badb);border-color:var(--bad);color:var(--bad)}
.sent{font:600 22px/1.5 "Be Vietnam Pro",sans-serif;text-align:center;margin:18px 0 6px;overflow-wrap:anywhere}
.blank{display:inline-block;min-width:4.5em;border-bottom:3px solid var(--pri);text-align:center;color:var(--pri);font-weight:800;padding:0 4px}
.blank.right{color:var(--ok);border-color:var(--ok)}
.blank.wrong{color:var(--bad);border-color:var(--bad)}
.form{display:grid;gap:8px;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:14px}
.form label{font-size:14px;color:var(--mute)}
.form input,.form select,textarea{width:100%;padding:10px 12px;border:2px solid var(--line);border-radius:10px;background:var(--bg)}
textarea{min-height:70px;font-size:13px}
.item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.item button{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;cursor:pointer;color:var(--bad)}
h2{font:800 20px/1.2 "Baloo 2",sans-serif;margin:20px 0 8px}
.msg{margin:10px 0 0;font-weight:600}
.acts{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.item .acts button.n,.fbtn{color:var(--ink)}
.fbtn{position:relative;border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:4px 10px;cursor:pointer;font-size:16px}
.fbtn input{position:absolute;inset:0;opacity:0;width:100%;cursor:pointer}
.fbtn:focus-within{outline:3px solid var(--pri);outline-offset:2px}
.form input[type=file]{padding:8px}
.badge{background:var(--hi);color:#1d2b4f;border-radius:6px;padding:0 6px;font-size:12px;margin-left:6px;font-weight:600}
.dl{display:flex;gap:10px;align-items:flex-start;padding:10px 6px;border-bottom:1px solid var(--line);border-left:5px solid transparent}
.dl.on{border-left-color:var(--pri);background:var(--paper)}
.dl .sp{font-weight:800;min-width:3.4em;color:var(--pri)}
.dl .en{font-size:18px;line-height:1.4}
.dl .vi{color:var(--mute);font-size:15px;margin-top:2px}
.dl button{border:2px solid var(--line);background:var(--paper);border-radius:8px;padding:2px 10px;cursor:pointer;flex-shrink:0}
</style>
</head>
<body>
<main>
  <h1>Từ vựng <span>Tiếng Anh 6</span></h1>
  <p class="sub">Global Success – Kết nối tri thức với cuộc sống</p>
  <label for="unit" class="sub">Chọn bài học</label>
  <select id="unit"></select>
  <div class="tabs" role="tablist" id="tabs"></div>
  <div id="tbar" class="tbar" role="timer" hidden></div>
  <section id="view" aria-live="polite"></section>
</main>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var payload=params.get("assignment");
  function fail(m){document.open();document.write('<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Không mở được bài</title><body style="font:16px system-ui;padding:24px;max-width:560px;margin:auto"><h2>Không mở được bài</h2><p>'+m+'</p></body>');document.close();}
  if(payload){
    try{
      var decoded=decodeURIComponent(escape(atob(payload)));
      var data=JSON.parse(decoded);
      if(!data||typeof data!=="object"||!data.title||!data.data){fail("Dữ liệu bài giao không hợp lệ.");return;}
      window.__ASSIGN=data;
    }catch(e){fail("Link bài tập bị lỗi hoặc dữ liệu không đọc được.");return;}
  }else{
    /* Tương thích link cũ lưu trên máy chủ dạng ?a=ID */
    var id=(params.get("a")||"").replace(/[^a-z0-9]/gi,"");
    if(!id){fail("Link chưa đúng. Hãy mở đúng link giáo viên đã gửi.");return;}
    try{
      var x=new XMLHttpRequest();x.open("GET","/api/assign?id="+encodeURIComponent(id),false);x.send();
      if(x.status!==200){fail("Bài kiểm tra không tồn tại hoặc đã bị xóa.");return;}
      window.__ASSIGN=JSON.parse(x.responseText);
    }catch(e){fail("Không kết nối được máy chủ. Hãy thử lại.");}
  }
})();
</script>
<script>
const ASSIGN = window.__ASSIGN||null;
const RAW = [

["Unit 2 – My House","living room|phòng khách;bedroom|phòng ngủ;kitchen|nhà bếp;bathroom|phòng tắm;fridge|tủ lạnh;cooker|bếp nấu;apartment|căn hộ;villa|biệt thự;town house|nhà phố"],

["Unit 10 – Our Houses in the Future","smart home|nhà thông minh;flying car|ô tô bay;spaceship|tàu vũ trụ;solar energy|năng lượng mặt trời;wireless|không dây;modern|hiện đại;hi-tech|công nghệ cao;helicopter|trực thăng;future|tương lai"],
["Unit 11 – Our Greener World","recycle|tái chế;reduce|giảm thiểu;reuse|tái sử dụng;environment|môi trường;pollution|ô nhiễm;plastic bag|túi ni lông;save|tiết kiệm;energy|năng lượng;rubbish|rác thải"],
["Unit 12 – Robots","robot|người máy;recognise|nhận ra;lift|nâng lên;guard|canh gác;build|xây dựng;teach|dạy học;worker|công nhân;invention|phát minh;program|lập trình"]
];
/* Unit 1-6: từ vựng lấy theo các mục Vocabulary và Glossary của Tiếng Anh 6 (Tập 1), nghĩa viết ngắn gọn */
RAW[0][1]="school lunch|bữa trưa ở trường;English|môn tiếng Anh;history|lịch sử;homework|bài tập về nhà;exercise|thể dục;science|khoa học;football|bóng đá;lessons|các bài học;music|âm nhạc;pencil sharpener|cái gọt bút chì;compass|com-pa;school bag|cặp sách;calculator|máy tính;rubber|cục tẩy;ruler|thước kẻ;pencil case|hộp bút;uniform|đồng phục;subject|môn học;classmate|bạn cùng lớp;boarding school|trường nội trú;international|quốc tế;activity|hoạt động;art|nghệ thuật, mỹ thuật;favourite|được yêu thích;smart|bảnh bao, gọn gàng;swimming pool|bể bơi;interview|phỏng vấn;knock|gõ (cửa);remember|nhớ, ghi nhớ;share|chia sẻ";
RAW[1][1]="town house|nhà phố;country house|nhà ở vùng quê;flat|căn hộ;hall|sảnh;kitchen|nhà bếp;bedroom|phòng ngủ;bathroom|phòng tắm;living room|phòng khách;lamp|đèn;toilet|nhà vệ sinh;picture|bức tranh;cupboard|tủ đựng bát đĩa, quần áo;sink|bồn rửa bát;sofa|ghế sofa;dishwasher|máy rửa bát;fridge|tủ lạnh;shower|vòi hoa sen;chest of drawers|tủ có ngăn kéo;cooker|bếp;wardrobe|tủ đựng quần áo;shelf|kệ, giá;furniture|đồ đạc trong nhà;between|ở giữa;next to|bên cạnh;in front of|ở đằng trước;behind|ở phía sau;under|ở dưới;department store|cửa hàng bách hóa;strange|kì lạ;crazy|kì lạ, lạ thường";
RAW[2][1]="cheek|má;eye|mắt;hand|bàn tay;arm|cánh tay;mouth|miệng;leg|chân;nose|mũi;hair|tóc;shoulder|vai;foot|bàn chân;appearance|ngoại hình;personality|tính cách;hard-working|chăm chỉ;confident|tự tin;funny|hài hước;caring|biết quan tâm;active|năng động;careful|cẩn thận;shy|xấu hổ, nhút nhát;creative|sáng tạo;clever|thông minh;kind|tốt bụng;friendly|thân thiện;loving|yêu thương;slim|mảnh khảnh;curly|xoăn";
RAW[3][1]="square|quảng trường;art gallery|phòng trưng bày nghệ thuật;cathedral|nhà thờ lớn;temple|ngôi đền, chùa;railway station|ga tàu hỏa;noisy|ồn ào;quiet|yên tĩnh;busy|nhộn nhịp;crowded|đông đúc;modern|hiện đại;peaceful|yên bình;beautiful|đẹp;boring|chán;exciting|thú vị, sôi động;expensive|đắt;cheap|rẻ;convenient|tiện lợi;clean|sạch sẽ;narrow|hẹp;famous|nổi tiếng;faraway|xa xôi;suburb|khu vực ngoại ô;outdoor|ngoài trời;dislike|không thích;sandy|có cát;cross|đi ngang qua;turning|chỗ ngoặt, chỗ rẽ;workshop|phân xưởng;finally|cuối cùng";
RAW[4][1]="mountain|núi;river|sông;waterfall|thác nước;forest|rừng;cave|hang động;desert|sa mạc;beach|bãi biển;island|đảo, hòn đảo;scenery|phong cảnh;amazing|tuyệt vời;natural wonder|kì quan thiên nhiên;plaster|băng gạc y tế;sleeping bag|túi ngủ;backpack|ba-lô;suncream|kem chống nắng;scissors|cái kéo;landscape|phong cảnh;join in|tham gia;boat|con thuyền;rock|tảng đá, phiến đá;mount|núi, đồi, đỉnh;mountain range|dãy núi;man-made|nhân tạo;litter|vứt rác bừa bãi;show|trình diễn;guide|hướng dẫn viên;holiday|kì nghỉ";
RAW[5][1]="lucky money|tiền lì xì;peach flower|hoa đào;banh chung|bánh chưng;banh tet|bánh tét;family gathering|sum họp gia đình;special food|món ăn đặc biệt;mochi rice cake|bánh gạo mochi;wish|điều ước, lời chúc;fireworks|pháo hoa;fun|sự vui đùa, vui vẻ;celebrate|kì niệm, tổ chức;decorate|trang hoàng;behave|đối xử, cư xử;cheer|chúc mừng, cổ vũ;relative|bà con, họ hàng;strike|đánh, điểm (giờ);throw|ném, vứt;welcome|chào đón;luck|điều may mắn;break|làm vỡ";
let W = [], custom = [], hid = [];
try{hid = JSON.parse(localStorage.getItem("tv6h")||"[]");}catch(e){}
function saveHid(){try{localStorage.setItem("tv6h",JSON.stringify(hid));}catch(e){} buildW();}
try{custom = JSON.parse(localStorage.getItem("tv6c")||"[]");}catch(e){}
function buildW(){ W=[]; RAW.forEach((u,i)=>u[1].split(";").forEach(p=>{const[a,b]=p.split("|");if(!hid.includes(a)) W.push({u:i,en:a,vi:b});})); custom.forEach(c=>W.push({u:c.u,en:c.en,vi:c.vi,s:c.s})); }
function saveCustom(){try{localStorage.setItem("tv6c",JSON.stringify(custom));}catch(e){} buildW();}
buildW();
let prog = {};
try{prog = JSON.parse(localStorage.getItem("tv6")||"{}");}catch(e){}
function save(){try{localStorage.setItem("tv6",JSON.stringify(prog));}catch(e){}}
function mark(w,ok){const p=prog[w.en]||(prog[w.en]={ok:0,bad:0});ok?p.ok++:p.bad++;save();}
const mastered = w => (prog[w.en]?.ok||0) - (prog[w.en]?.bad||0) >= 2;
const $ = s => document.querySelector(s);
const shuffle = a => { a=[...a]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.toLowerCase().replace(/[^a-z0-9]/g,"");
let curAudio=null;
function say(t){
  const a = audioMap[t.trim().toLowerCase()];
  try{ speechSynthesis.cancel(); }catch(e){}
  if(a){ try{ if(curAudio) curAudio.pause(); curAudio=new Audio(a); curAudio.play().catch(()=>{}); return; }catch(e){} }
  try{const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u);}catch(e){}
}
/* Âm thanh do giáo viên tải lên: lưu trong IndexedDB của trình duyệt */
const ak = s => s.trim().toLowerCase();
let audioMap = {};
const idb = () => new Promise((res,rej)=>{ try{ const r=indexedDB.open("tv6a",1); r.onupgradeneeded=()=>r.result.createObjectStore("audio"); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }catch(e){rej(e);} });
const rq = r => new Promise((res,rej)=>{ r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); });
async function audioPut(en,file){ const db=await idb(); const t=db.transaction("audio","readwrite"); await rq(t.objectStore("audio").put(file,ak(en))); if(audioMap[ak(en)]) URL.revokeObjectURL(audioMap[ak(en)]); audioMap[ak(en)]=URL.createObjectURL(file); }
async function audioDel(en){ try{ const db=await idb(); await rq(db.transaction("audio","readwrite").objectStore("audio").delete(ak(en))); }catch(e){} if(audioMap[ak(en)]){ URL.revokeObjectURL(audioMap[ak(en)]); delete audioMap[ak(en)]; } }
async function audioLoad(){ try{ const db=await idb(); const st=db.transaction("audio").objectStore("audio"); const keys=await rq(st.getAllKeys()), vals=await rq(st.getAll()); keys.forEach((k,i)=>{audioMap[k]=URL.createObjectURL(vals[i]);}); }catch(e){} }
function audioCheck(f){ if(!(f.type||"").startsWith("audio/") && !/\.(mp3|m4a|wav|ogg|aac|webm)$/i.test(f.name)) return "Tệp phải là file âm thanh (mp3, m4a, wav, ogg)."; if(f.size>2*1024*1024) return "Tệp quá lớn. Hãy chọn file dưới 2 MB."; return ""; }
audioLoad();

const sel = $("#unit");
sel.innerHTML = '<option value="all">Tất cả các bài (' + W.length + ' từ)</option>' + RAW.map((u,i)=>`<option value="${i}">${u[0]}</option>`).join("");
const curUnit = () => ASSIGN ? String(ASSIGN.unit) : sel.value;
const pool = () => { const v=curUnit(); return v==="all" ? W : W.filter(w=>w.u==+v); };

const MODES = [["learn","Học từ"],["quiz","Trắc nghiệm"],["type","Gõ từ"],["fill","Điền từ"],["dlg","Hội thoại"],["stats","Tiến độ"],["teach","Giáo viên"]].filter(m=>!(ASSIGN&&m[0]==="teach"));
let mode = "learn";
$("#tabs").innerHTML = MODES.map(m=>`<button role="tab" data-m="${m[0]}">${m[1]}</button>`).join("");
function setTabs(){document.querySelectorAll("#tabs button").forEach(b=>b.setAttribute("aria-selected",b.dataset.m===mode));}
$("#tabs").onclick = e => { const b=e.target.closest("button"); if(b){mode=b.dataset.m;start();} };
sel.onchange = start;

let deck=[], i=0, flipped=false, score=0, pending=false;
function start(){
  stopDlg(); setTabs(); i=0; flipped=false; score=0; pending=false;
  if(!TESTS.includes(mode)){ stopTimer(); locked=false; }
  if(mode==="stats") return stats();
  if(mode==="dlg") return dlgView();
  if(mode==="teach") return teach();
  deck = shuffle(pool());
  if(mode==="fill") deck=shuffle(fillItems());
  if(mode!=="learn") deck = deck.slice(0,10);
  if(TESTS.includes(mode) && !gate()) return;
  ({learn,quiz,type,fill})[mode]();
}

function learn(){
  const w = deck[i];
  $("#view").innerHTML = `<div class="meta"><span>Thẻ ${i+1}/${deck.length}</span><span>${mastered(w)?"Đã thuộc":""}</span></div>
  <button class="card" id="card" aria-label="Lật thẻ">
    <div class="en">${esc(w.en)}</div>
    ${flipped?`<div class="vi">${esc(w.vi)}</div>`:'<div class="hint">Chạm để xem nghĩa</div>'}
  </button>
  <div class="row"><button class="btn" id="spk">Nghe phát âm</button></div>
  <label class="sub" style="display:block;margin-top:8px"><input type="checkbox" id="aut" ${autoPlay?"checked":""}> Tự đọc khi hiện thẻ mới</label>
  <div class="row"><button class="btn bad" id="no">Chưa nhớ</button><button class="btn ok" id="yes">Đã nhớ</button></div>`;
  $("#card").onclick = () => { flipped=!flipped; if(flipped) say(w.en); learn(); };
  $("#spk").onclick = () => say(w.en);
  $("#aut").onchange = e => { autoPlay=e.target.checked; try{ localStorage.setItem("tv6ap",autoPlay?"1":"0"); }catch(x){} };
  if(autoPlay && lastShown!==w.en && !flipped){ lastShown=w.en; say(w.en); }
  const next = ok => { mark(w,ok); i++; flipped=false; if(i>=deck.length){deck=shuffle(pool());i=0;} learn(); };
  $("#yes").onclick = () => next(true);
  $("#no").onclick = () => next(false);
}

function quiz(){
  if(locked) return;
  if(i>=deck.length) return result("Trắc nghiệm");
  const w = deck[i], toVi = i%2===0, all = W.filter(x=>x!==w);
  const others = shuffle(all.filter(x=>x.u===w.u)).concat(shuffle(all)).filter((x,k,a)=>a.findIndex(y=>y.en===x.en)===k).slice(0,3);
  const opts = shuffle([w,...others]);
  const key = toVi ? "vi" : "en";
  $("#view").innerHTML = `<div class="meta"><span>Câu ${i+1}/${deck.length}</span><span>Điểm: ${score}</span></div>
  <div class="q">${esc(toVi?w.en:w.vi)}</div>
  <div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o[key])}</button>`).join("")}</div>
  <div class="fb" id="fb"></div>`;
  pending=false;
  document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(pending) return; pending=true;
    const o = opts[+b.dataset.k], ok = o===w;
    mark(w,ok); if(ok) score++;
    b.classList.add(ok?"right":"wrong");
    if(!ok) document.querySelectorAll(".opt").forEach(x=>{ if(opts[+x.dataset.k]===w) x.classList.add("right"); });
    $("#fb").textContent = ok ? "Chính xác!" : "Đáp án đúng: " + w[key];
    if(toVi||ok) say(w.en);
    setTimeout(()=>{i++;quiz();}, ok?800:1800);
  });
}

function type(){
  if(locked) return;
  if(i>=deck.length) return result("Gõ từ");
  const w = deck[i];
  $("#view").innerHTML = `<div class="meta"><span>Câu ${i+1}/${deck.length}</span><span>Điểm: ${score}</span></div>
  <div class="q">${esc(w.vi)}</div>
  <p class="sub" style="text-align:center">Gõ từ tiếng Anh tương ứng (${w.en.length} ký tự, gợi ý: bắt đầu bằng “${esc(w.en[0])}”)</p>
  <input class="field" id="ans" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Từ tiếng Anh">
  <div class="row"><button class="btn pri" id="chk">Kiểm tra</button></div>
  <div class="fb" id="fb"></div>`;
  const inp = $("#ans"); inp.focus(); pending=false;
  const check = () => {
    if(pending) return;
    if(!inp.value.trim()){ $("#fb").innerHTML='<span class="err">Hãy gõ một từ trước khi kiểm tra.</span>'; return; }
    pending=true;
    const ok = norm(inp.value)===norm(w.en);
    mark(w,ok); if(ok) score++;
    $("#fb").innerHTML = ok ? '<span style="color:var(--ok)">Chính xác!</span>' : `<span class="err">Chưa đúng. Đáp án: <b>${esc(w.en)}</b></span>`;
    say(w.en);
    setTimeout(()=>{i++;type();}, ok?800:2000);
  };
  $("#chk").onclick = check;
  inp.onkeydown = e => { if(e.key==="Enter") check(); };
}

function result(name,timedOut){
  stopTimer(); if(timedOut) locked=true;
  if(ASSIGN&&ASSIGN.once){ try{ localStorage.setItem(dkey(mode),JSON.stringify({s:score,n:deck.length,t:!!timedOut})); }catch(e){} }
  const n = deck.length, pct = Math.round(score/n*100);
  const msg = timedOut?"Hết giờ! Bài làm đã bị khóa, các câu chưa trả lời được tính là sai.":pct>=90?"Xuất sắc!":pct>=70?"Làm tốt lắm!":pct>=50?"Khá ổn, ôn thêm chút nữa nhé.":"Hãy học lại bằng chế độ Học từ rồi thử lại.";
  $("#view").innerHTML = `<div class="score"><div class="sub">${name}</div><b>${score}/${n}</b><p>${msg}</p></div>
  <div class="row">${ASSIGN&&ASSIGN.once?"":'<button class="btn" id="again">Làm lại</button>'}<button class="btn pri" id="goLearn">Học từ</button></div>`;
  if($("#again")) $("#again").onclick = start;
  $("#goLearn").onclick = () => { mode="learn"; start(); };
  if(ASSIGN) showSubmit(timedOut);
}

function stats(){
  const total = W.filter(mastered).length;
  $("#view").innerHTML = `<div class="meta"><span>Tổng quan</span><span>${total}/${W.length} từ đã thuộc</span></div>
  <div class="bar"><i style="width:${total/W.length*100}%"></i></div>` +
  RAW.map((u,k)=>{ const ws=W.filter(w=>w.u===k), m=ws.filter(mastered).length;
    return `<div class="meta"><span>${u[0]}</span><span>${m}/${ws.length}</span></div><div class="bar"><i style="width:${m/ws.length*100}%"></i></div>`; }).join("") +
  `<p class="sub">Một từ được tính là “đã thuộc” khi bạn trả lời đúng nhiều hơn sai ít nhất 2 lần.</p>
  <div class="row"><button class="btn bad" id="reset">Xóa tiến độ</button></div>`;
  $("#reset").onclick = () => { if(confirm("Xóa toàn bộ tiến độ học?")){prog={};save();stats();} };
}const SENT = {};

function blankHTML(s,fill,cls){ const p=s.split("___"); return esc(p[0])+`<span class="blank ${cls||""}">${fill?esc(fill):"&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;"}</span>`+esc(p.slice(1).join("___")); }
function fill(){
  if(locked) return;
  if(!deck.length){ $("#view").innerHTML='<p class="sub">Bài này chưa có câu điền từ. Hãy chọn bài khác hoặc thêm câu ở tab Giáo viên.</p>'; return; }
  if(i>=deck.length) return result("Điền từ");
  const it=deck[i], w={en:it.a,vi:it.vi,u:it.w.u}, s=it.s, choose=i<Math.ceil(deck.length/2); pending=false;
  const head=`<div class="meta"><span>Câu ${i+1}/${deck.length} – ${choose?"Chọn từ":"Gõ từ"}</span><span>Điểm: ${score}</span></div><div class="sent" id="sent">${blankHTML(s)}</div>${w.vi?`<p class="sub" style="text-align:center">Gợi ý: ${esc(w.vi)}</p>`:""}`;
  const finish = ok => {
    mark(w,ok); if(ok) score++;
    $("#sent").innerHTML = blankHTML(s,w.en,ok?"right":"wrong");
    $("#fb").innerHTML = ok ? '<span style="color:var(--ok)">Chính xác!</span>' : `<span class="err">Đáp án đúng: <b>${esc(w.en)}</b></span>`;
    say(w.en);
    setTimeout(()=>{i++;fill();}, ok?1200:2400);
  };
  if(choose){
    const rest=W.filter(x=>x.en!==w.en);
    const others=shuffle(rest.filter(x=>x.u===w.u)).concat(shuffle(rest)).filter((x,k,a)=>a.findIndex(y=>y.en===x.en)===k).slice(0,3);
    const opts=shuffle([w,...others]);
    $("#view").innerHTML = head+`<div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o.en)}</button>`).join("")}</div><div class="fb" id="fb"></div>`;
    document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      if(pending) return; pending=true;
      const ok=opts[+b.dataset.k]===w;
      b.classList.add(ok?"right":"wrong");
      if(!ok) document.querySelectorAll(".opt").forEach(x=>{ if(opts[+x.dataset.k]===w) x.classList.add("right"); });
      finish(ok);
    });
  } else {
    $("#view").innerHTML = head+`<input class="field" id="ans" autocomplete="off" autocapitalize="none" spellcheck="false" aria-label="Từ cần điền"><div class="row"><button class="btn pri" id="chk">Kiểm tra</button></div><div class="fb" id="fb"></div>`;
    const inp=$("#ans"); inp.focus();
    const check=()=>{
      if(pending) return;
      if(!inp.value.trim()){ $("#fb").innerHTML='<span class="err">Hãy gõ một từ trước khi kiểm tra.</span>'; return; }
      pending=true; finish(norm(inp.value)===norm(w.en));
    };
    $("#chk").onclick=check; inp.onkeydown=e=>{ if(e.key==="Enter") check(); };
  }
}

function chk(s){ let h=5381; for(const c of s+"tv6-k") h=((h<<5)+h+c.charCodeAt(0))>>>0; return h.toString(36); }
function makeCode(timedOut){
  const o={a:ASSIGN.id,i:ASSIGN.title||"",n:getName(),m:mode,s:score,t:deck.length,o:timedOut?1:0,d:Date.now()};
  const b=btoa(unescape(encodeURIComponent(JSON.stringify(o))));
  return "TV6."+b+"."+chk(b);
}
function parseCode(c){
  const m=String(c).trim().match(/^TV6\.([A-Za-z0-9+/=]+)\.([a-z0-9]+)$/);
  if(!m||chk(m[1])!==m[2]) return null;
  try{
    const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));
    if(typeof o.a!=="string"||typeof o.n!=="string"||!TESTS.includes(o.m)||!Number.isFinite(o.s)||!Number.isFinite(o.t)||!Number.isFinite(o.d)) return null;
    return {a:o.a.slice(0,40),i:String(o.i||"").slice(0,80),n:o.n.slice(0,40),m:o.m,s:o.s,t:o.t,o:o.o?1:0,d:o.d};
  }catch(e){ return null; }
}

  ${custom.length?custom.map((c,k)=>`<div class="item"><span><b>${esc(c.en)}</b> – ${esc(c.vi)}<br><small class="sub">${esc(RAW[c.u][0])}</small></span><span class="acts">${audioMap[ak(c.en)]?`<button class="n" data-p="${k}">Nghe</button><button class="n" data-r="${k}" aria-label="Bỏ âm thanh của ${esc(c.en)}">Bỏ âm thanh</button>`:""}<label class="fbtn">${audioMap[ak(c.en)]?"Đổi file":"Tải âm thanh"}<input type="file" accept="audio/*" data-f="${k}" aria-label="Tải âm thanh cho ${esc(c.en)}"></label><button data-d="${k}" aria-label="Xóa từ ${esc(c.en)}">Xóa</button></span></div>`).join(""):'<p class="sub">Chưa có từ nào. Nhập từ ở trên để thêm vào bài học.</p>'}
  <h2>Giao bài kiểm tra có tính giờ</h2>
  <div class="form">
    <label for="at">Tên bài kiểm tra</label><input id="at" autocomplete="off" placeholder="Kiểm tra từ vựng Unit 1" value="${esc(asg.title)}">
    <label for="au">Phạm vi</label>
    <select id="au"><option value="all">Tất cả các bài</option>${RAW.map((u,k)=>`<option value="${k}"${String(k)===String(asg.unit)?" selected":""}>${u[0]}</option>`).join("")}</select>
    <label for="a1">Thời gian phần Trắc nghiệm (phút, 0 = không giới hạn)</label><input id="a1" type="number" min="0" max="180" value="${tset.quiz}">
    <label for="a2">Thời gian phần Gõ từ (phút)</label><input id="a2" type="number" min="0" max="180" value="${tset.type}">
    <label for="a3">Thời gian phần Điền từ (phút)</label><input id="a3" type="number" min="0" max="180" value="${tset.fill}">
    <label><input type="checkbox" id="ao" ${asg.once?"checked":""} style="width:auto"> Mỗi phần chỉ được làm một lần (hết giờ là khóa)</label>
    <button class="btn pri" id="agen">Tạo mã giao bài</button>
  </div>
  <p class="msg" id="amsg"></p>
  ${srv.ok&&!srv.cfg?'<p class="msg" style="color:var(--bad)">Máy chủ chưa cấu hình Upstash Redis hoặc TEACHER_KEY trên Vercel.</p>':""}
  ${srv.ok?`<div class="form"><label for="tk">Mật khẩu giáo viên (biến TEACHER_KEY đặt trên Vercel)</label><input id="tk" type="password" autocomplete="off" value="${esc(tkey)}"><button class="btn pri" id="alink">${asg.id?"Cập nhật link học sinh":"Tạo link học sinh"}</button>${asg.id?'<button class="btn" id="anew">Tạo link mới</button>':""}</div><p class="msg" id="lmsg"></p>${asg.id?`<p class="sub">Link học sinh: <b>${esc(location.origin+"/hoc-sinh/?a="+asg.id)}</b></p><div class="row"><button class="btn" id="lcp">Sao chép link học sinh</button></div>`:""}`:""}
  <textarea id="aexp" readonly placeholder="Mã giao bài sẽ hiện ở đây" aria-label="Mã giao bài"></textarea>
  <div class="row"><button class="btn" id="acp">Sao chép mã giao bài</button></div>
  <p class="sub">Link học sinh không có tab Giáo viên. Để tạo hoặc cập nhật link, hãy gửi mã này cho Claude trong khung chat kèm câu “tạo link học sinh”. Thời gian đặt ở đây cũng áp dụng khi bạn làm thử trên trang này.</p>
  <h2>Bảng điểm học sinh (${scores.length} bài nộp)</h2>
  <p class="sub">Dán mã nộp điểm học sinh gửi vào đây. Có thể dán nhiều mã cùng lúc, mỗi mã một dòng.</p>
  <textarea id="sin" style="min-height:90px" placeholder="TV6.eyJh..." aria-label="Dán mã nộp điểm"></textarea>
  <div class="row"><button class="btn pri" id="sadd">Nhận điểm</button></div>
  <p class="msg" id="smsg2"></p>
  ${srv.ok?'<div class="row"><button class="btn pri" id="sfetch">Tải điểm từ máy chủ</button></div>':""}
  ${scoreBoard()}
  ${scores.length?'<div class="row"><button class="btn" id="scpy">Sao chép bảng điểm (dán vào Excel)</button><button class="btn" id="sclr">Xóa bảng điểm</button></div>':""}
  <h2>Chia sẻ cho học sinh</h2>
  <p class="sub">Từ được lưu trên thiết bị này. Để học sinh có cùng danh sách, sao chép mã bên dưới gửi cho các em, rồi dán vào ô nhập mã trong tab Giáo viên của các em.</p>
  <textarea id="exp" readonly aria-label="Mã chia sẻ">${esc(custom.length||exs.length||dlgs.length||hid.length||Object.keys(dlgOv).length?JSON.stringify({w:custom,e:exs,d:dlgs,o:dlgOv,h:hid}):"")}</textarea>
  <div class="row"><button class="btn" id="cp">Sao chép mã</button></div>
  <textarea id="imp" placeholder="Dán mã từ giáo viên vào đây" aria-label="Nhập mã"></textarea>
  <div class="row"><button class="btn pri" id="imb">Nhập từ mã</button></div>`;
  const note = (t,bad) => { tmsg = t; const m=$("#tmsg"); m.textContent=t; m.style.color = bad?"var(--bad)":"var(--ok)"; };
  $("#add").onclick = async () => {
    const en=$("#ten").value.trim(), vi=$("#tvi").value.trim(), u=+$("#tu").value;
    if(!en||!vi){ note("Hãy nhập cả từ tiếng Anh và nghĩa tiếng Việt.",true); return; }
    if(W.some(w=>w.en.toLowerCase()===en.toLowerCase())){ note("Từ “"+en+"” đã có trong danh sách.",true); return; }
    const f=$("#taf").files[0]; let amsg="";
    const sn=$("#tsn").value.trim();
    if(sn&&!sn.includes("___")){ note("Câu điền từ cần có ___ ở chỗ trống.",true); return; }
    if(f){ const er=audioCheck(f); if(er){ note(er,true); return; } }
    custom.push({u,en,vi,s:sn||undefined}); saveCustom(); lstU=u;
    if(f){ try{ await audioPut(en,f); amsg=" Đã lưu tệp phát âm."; }catch(e){ amsg=" Không lưu được tệp âm thanh trên trình duyệt này."; } } tmsg="Đã thêm “"+en+"” vào "+RAW[u][0]+"."+amsg+(f?"":" Từ này sẽ tự động đọc bằng giọng đọc của máy; bạn có thể tải file âm thanh để thay thế."); teach(); $("#tmsg").style.color="var(--ok)"; $("#ten").focus();
  };
  document.querySelectorAll("[data-d]").forEach(b=>b.onclick=()=>{ const c=custom[+b.dataset.d]; custom.splice(+b.dataset.d,1); saveCustom(); audioDel(c.en); tmsg="Đã xóa “"+c.en+"”."; teach(); });
  document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>say(custom[+b.dataset.p].en));
  document.querySelectorAll("[data-f]").forEach(inp=>inp.onchange=async()=>{
    const c=custom[+inp.dataset.f], f=inp.files[0]; if(!f) return;
    const er=audioCheck(f); if(er){ tmsg=er; teach(); $("#tmsg").style.color="var(--bad)"; return; }
    try{ await audioPut(c.en,f); tmsg="Đã lưu âm thanh cho “"+c.en+"”."; }catch(x){ tmsg="Không lưu được âm thanh trên trình duyệt này."; }
    teach();
  });
  document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{ const c=custom[+b.dataset.r]; await audioDel(c.en); tmsg="Đã bỏ âm thanh của “"+c.en+"”."; teach(); });
  const listUnit = () => {
    const k=+$("#lu").value; lstU=k;
    const ws=W.filter(w=>w.u===k);
    const isNew=w=>custom.some(c=>c.u===k&&ak(c.en)===ak(w.en));
    const nNew=ws.filter(isNew).length, nEx=exs.filter(x=>x.u===k).length;
    $("#lst").innerHTML = `<p class="sub"><b>${ws.length} từ</b> (${ws.length-nNew} từ có sẵn, ${nNew} từ giáo viên thêm), ${nEx} bài tập tự tạo.</p>` +
      ws.map(w=>{ const n=isNew(w); const tags=[sentOf(w)?"có câu điền từ":"chưa có câu điền từ"]; if(audioMap[ak(w.en)]) tags.push("có âm thanh"); if(mastered(w)) tags.push("học sinh đã thuộc");
        return `<div class="item"><span><b>${esc(w.en)}</b> – ${esc(w.vi)}${n?'<span class="badge">Mới</span>':""}<br><small class="sub">${tags.join(", ")}</small></span></div>`; }).join("");
  };
  const renderList = () => {
    const k=+$("#lu").value; lstU=k;
    const ws=W.filter(w=>w.u===k);
    const isNew=w=>custom.some(c=>c.u===k&&ak(c.en)===ak(w.en));
    const baseAll=RAW[k][1].split(";").map(p=>{ const q=p.split("|"); return {en:q[0],vi:q[1]}; });
    const hidden=baseAll.filter(w=>hid.includes(w.en));
    const nNew=ws.filter(isNew).length, nEx=exs.filter(x=>x.u===k).length;
    $("#lst").innerHTML = `<p class="sub"><b>${ws.length} từ</b> (${ws.length-nNew} từ có sẵn, ${nNew} từ giáo viên thêm${hidden.length?", "+hidden.length+" từ có sẵn đang ẩn":""}), ${nEx} bài tập tự tạo.</p>` +
      `<div class="row" style="flex-wrap:wrap;margin:0 0 8px"><button class="btn" id="hall">Ẩn hết từ có sẵn của Unit này</button>${hidden.length?'<button class="btn" id="sall">Hiện lại từ có sẵn</button>':""}</div>` +
      ws.map(w=>{ const n=isNew(w); const tags=[sentOf(w)?"có câu điền từ":"chưa có câu điền từ"]; if(audioMap[ak(w.en)]) tags.push("có âm thanh"); if(mastered(w)) tags.push("học sinh đã thuộc");
        return `<div class="item"><span><b>${esc(w.en)}</b> – ${esc(w.vi)}${n?'<span class="badge">Mới</span>':""}<br><small class="sub">${tags.join(", ")}</small></span>${n?"":`<button data-h="${esc(w.en)}" aria-label="Ẩn từ ${esc(w.en)}">Ẩn</button>`}</div>`; }).join("") +
      hidden.map(w=>`<div class="item" style="opacity:.65"><span><b>${esc(w.en)}</b> – ${esc(w.vi)}<br><small class="sub">đang ẩn</small></span><button style="color:var(--ink)" data-s="${esc(w.en)}">Hiện lại</button></div>`).join("");
    document.querySelectorAll("[data-h]").forEach(b=>b.onclick=()=>{ hid.push(b.dataset.h); saveHid(); renderList(); });
    document.querySelectorAll("[data-s]").forEach(b=>b.onclick=()=>{ hid=hid.filter(x=>x!==b.dataset.s); saveHid(); renderList(); });
    $("#hall").onclick=()=>{ if(!confirm("Ẩn tất cả từ có sẵn của Unit này? Bạn có thể hiện lại bất cứ lúc nào.")) return; baseAll.forEach(w=>{ if(!hid.includes(w.en)) hid.push(w.en); }); saveHid(); renderList(); };
    if($("#sall")) $("#sall").onclick=()=>{ hid=hid.filter(x=>!baseAll.some(w=>w.en===x)); saveHid(); renderList(); };
  };
  $("#lu").onchange = renderList; renderList();
  $("#badd").onclick = () => {
    const u=+$("#bu").value, lines=$("#bt").value.split("\n").map(x=>x.trim()).filter(Boolean);
    const bnote=(t,bad)=>{ bmsg=t; const m=$("#bmsg"); m.textContent=t; m.style.color=bad?"var(--bad)":"var(--ok)"; };
    if(!lines.length){ bnote("Hãy dán danh sách từ trước.",true); return; }
    let ok=0, skip=0;
    lines.forEach(line=>{
      const p=line.split(/\s*\|\s*|\t|\s+[-–—]\s+/);
      const en=(p[0]||"").trim().slice(0,60), vi=p.slice(1).join(" - ").trim().slice(0,100);
      if(!en||!vi||W.some(w=>ak(w.en)===ak(en))){ skip++; return; }
      custom.push({u,en,vi}); buildW(); ok++;
    });
    saveCustom(); lstU=u;
    bmsg="Đã thêm "+ok+" từ"+(skip?", bỏ qua "+skip+" dòng (từ đã có hoặc sai mẫu)":"")+"."+(ok?" Các từ mới sẽ tự động có giọng đọc của máy.":""); teach(); $("#bmsg").style.color=ok?"var(--ok)":"var(--bad)";
  };
  $("#dadd").onclick = () => {
    const dnote=(t,bad)=>{ dmsg=t; const m=$("#dmsg"); m.textContent=t; m.style.color=bad?"var(--bad)":"var(--ok)"; };
    const u=+$("#du").value, t=$("#dt").value.trim(), v=$("#dv").value.trim().slice(0,80), l=parseDlg($("#dl").value);
    if(!t){ dnote("Hãy nhập tên hội thoại.",true); return; }
    if(!l){ dnote("Mỗi dòng cần theo mẫu: Tên: câu tiếng Anh | nghĩa tiếng Việt (tối đa 30 dòng).",true); return; }
    if(l.length<2){ dnote("Hội thoại cần ít nhất 2 câu.",true); return; }
    if(dEdit){ const nd={u,t:t.slice(0,80),v,l}; if(dEdit.src==="b") dlgOv["b"+dEdit.id]=nd; else dlgs[dEdit.id]=nd; dEdit=null; saveDlg(); saveOv(); dmsg="Đã lưu thay đổi hội thoại."; }
    else { dlgs.push({u,t:t.slice(0,80),v,l}); saveDlg(); dmsg="Đã thêm hội thoại vào "+RAW[u][0]+"."; }
    teach(); $("#dmsg").style.color="var(--ok)";
  };
  if($("#dcancel")) $("#dcancel").onclick = () => { dEdit=null; teach(); };
  document.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{
    const [s,id]=b.dataset.ed.split(":"), d=dlgRef(s,+id);
    dEdit={src:s,id:+id,u:d.u,t:d.t,v:d.v||"",text:d.l.map(x=>x[0]+": "+x[1]+" | "+x[2]).join("\n")};
    teach(); $("#dh").scrollIntoView({block:"start"});
  });
  document.querySelectorAll("[data-dd]").forEach(b=>b.onclick=()=>{
    if(!confirm("Xóa hội thoại này?")) return;
    const [s,id]=b.dataset.dd.split(":");
    if(s==="b") dlgOv["b"+id]={del:true}; else dlgs.splice(+id,1);
    dEdit=null; saveDlg(); saveOv(); dmsg="Đã xóa hội thoại."; teach();
  });
  document.querySelectorAll("[data-rs]").forEach(b=>b.onclick=()=>{ delete dlgOv["b"+b.dataset.rs]; dEdit=null; saveOv(); dmsg="Đã khôi phục bản gốc."; teach(); });
  $("#xadd").onclick = () => {
    const u=+$("#xu").value, s=$("#xs").value.trim(), a=$("#xa").value.trim(), h=$("#xh").value.trim();
    const xnote=(t,bad)=>{ xmsg=t; const m=$("#xmsg"); m.textContent=t; m.style.color=bad?"var(--bad)":"var(--ok)"; };
    if(!s.includes("___")){ xnote("Câu cần có ___ ở chỗ trống.",true); return; }
    if(s.split("___").length>2){ xnote("Mỗi câu chỉ có một chỗ trống ___.",true); return; }
    if(!a){ xnote("Hãy nhập từ cần điền.",true); return; }
    if(exs.some(x=>x.s===s&&ak(x.a)===ak(a))){ xnote("Bài tập này đã có.",true); return; }
    exs.push({u,s:s.slice(0,200),a:a.slice(0,60),h:h.slice(0,100)}); saveEx();
    xmsg="Đã thêm bài tập vào "+RAW[u][0]+"."; teach(); $("#xmsg").style.color="var(--ok)"; $("#xs").focus();
  };
  document.querySelectorAll("[data-x]").forEach(b=>b.onclick=()=>{ exs.splice(+b.dataset.x,1); saveEx(); xmsg="Đã xóa bài tập."; teach(); });
  if($("#xtry")) $("#xtry").onclick = () => { mode="fill"; start(); };
  const pushAssign=async(forceNew)=>{
    const m=$("#lmsg"); tkey=$("#tk").value.trim(); try{ localStorage.setItem("tv6k",tkey); }catch(e){}
    if(!tkey){ m.textContent="Hãy nhập mật khẩu giáo viên."; m.style.color="var(--bad)"; return; }
    m.textContent="Đang lưu..."; m.style.color="var(--mute)";
    try{
      const r=await api("/api/assign",{method:"POST",body:JSON.stringify(readAssign(forceNew))});
      asg.id=r.id; saveSet(); teach();
      const m2=$("#lmsg"); m2.textContent="Đã lưu bài. Hãy gửi link học sinh bên dưới cho lớp."; m2.style.color="var(--ok)";
    }catch(e){ m.textContent="Không lưu được: "+e.message; m.style.color="var(--bad)"; }
  };
  if($("#alink")) $("#alink").onclick=()=>pushAssign(false);
  if($("#anew")) $("#anew").onclick=()=>pushAssign(true);
  if($("#lcp")) $("#lcp").onclick=async()=>{ const m=$("#lmsg"); try{ await navigator.clipboard.writeText(location.origin+"/hoc-sinh/?a="+asg.id); m.textContent="Đã sao chép link học sinh."; m.style.color="var(--ok)"; }catch(e){ m.textContent="Hãy tự sao chép link hiển thị phía trên."; m.style.color="var(--bad)"; } };
  if($("#sfetch")) $("#sfetch").onclick=async()=>{
    const m=$("#smsg2");
    if(!tkey){ m.textContent="Hãy nhập mật khẩu giáo viên ở mục Giao bài trước."; m.style.color="var(--bad)"; return; }
    try{
      const r=await api("/api/scores"); let ok=0;
      (r.scores||[]).forEach(o=>{ if(o&&typeof o.n==="string"&&TESTS.includes(o.m)&&Number.isFinite(o.s)&&Number.isFinite(o.t)&&Number.isFinite(o.d)&&!scores.some(x=>x.a===o.a&&x.n===o.n&&x.m===o.m&&x.d===o.d)){ scores.push({a:String(o.a),i:String(o.i||""),n:o.n.slice(0,40),m:o.m,s:o.s,t:o.t,o:o.o?1:0,d:o.d}); ok++; } });
      saveScores(); teach();
      const m2=$("#smsg2"); m2.textContent="Đã tải "+ok+" bài mới từ máy chủ."; m2.style.color="var(--ok)";
    }catch(e){ m.textContent="Không tải được: "+e.message; m.style.color="var(--bad)"; }
  };
  $("#sadd").onclick = () => {
    const found=[...$("#sin").value.matchAll(/TV6\.[A-Za-z0-9+/=]+\.[a-z0-9]+/g)].map(m=>m[0]);
    const msg=$("#smsg2");
    if(!found.length){ msg.textContent="Không tìm thấy mã nộp điểm hợp lệ."; msg.style.color="var(--bad)"; return; }
    let ok=0, dup=0, bad=0;
    found.forEach(c=>{ const o=parseCode(c); if(!o){ bad++; return; } if(scores.some(x=>x.a===o.a&&x.n===o.n&&x.m===o.m&&x.d===o.d)){ dup++; return; } scores.push(o); ok++; });
    saveScores(); teach();
    const m2=$("#smsg2"); m2.textContent="Đã nhận "+ok+" bài"+(dup?", bỏ qua "+dup+" mã trùng":"")+(bad?", "+bad+" mã không hợp lệ hoặc bị sửa":"")+"."; m2.style.color=ok?"var(--ok)":"var(--bad)";
  };
  if($("#scpy")) $("#scpy").onclick = async () => {
    const tsv=[["Họ tên","Bài","Phần","Điểm","Tổng","Hết giờ","Thời gian nộp"]].concat(scores.slice().sort((x,y)=>x.n.localeCompare(y.n,"vi")||x.m.localeCompare(y.m)).map(x=>[x.n,x.i,TNAME[x.m]||x.m,x.s,x.t,x.o?"có":"không",new Date(x.d).toLocaleString("vi-VN")])).map(r=>r.join("\t")).join("\n");
    const m=$("#smsg2");
    try{ await navigator.clipboard.writeText(tsv); m.textContent="Đã sao chép bảng điểm, hãy dán vào Excel hoặc Google Sheets."; m.style.color="var(--ok)"; }catch(e){ m.textContent="Không sao chép được trên trình duyệt này."; m.style.color="var(--bad)"; }
  };
  if($("#sclr")) $("#sclr").onclick = () => { if(!confirm("Xóa toàn bộ bảng điểm?")) return; scores=[]; saveScores(); teach(); };
  $("#agen").onclick = () => {
    const mins=v=>Math.max(0,Math.min(180,Math.round(+v||0)));
    tset={quiz:mins($("#a1").value),type:mins($("#a2").value),fill:mins($("#a3").value)};
    asg={title:($("#at").value.trim().slice(0,80)||"Bài kiểm tra từ vựng"),unit:$("#au").value,once:$("#ao").checked};
    saveSet();
    const code={id:"a"+Date.now().toString(36),title:asg.title,unit:asg.unit==="all"?"all":+asg.unit,t:tset,once:asg.once,data:{w:custom,e:exs,d:dlgs,o:dlgOv,h:hid}};
    $("#aexp").value=JSON.stringify(code);
    const m=$("#amsg"); m.textContent="Đã tạo mã giao bài. Hãy sao chép và gửi cho Claude để tạo link học sinh."; m.style.color="var(--ok)";
  };
  $("#acp").onclick = async () => {
    const v=$("#aexp").value, m=$("#amsg");
    if(!v){ m.textContent="Hãy bấm Tạo mã giao bài trước."; m.style.color="var(--bad)"; return; }
    try{ await navigator.clipboard.writeText(v); m.textContent="Đã sao chép mã giao bài."; m.style.color="var(--ok)"; }catch(e){ $("#aexp").select(); m.textContent="Hãy nhấn giữ và sao chép mã trong ô trên."; m.style.color="var(--bad)"; }
  };
  $("#cp").onclick = async () => { try{ await navigator.clipboard.writeText($("#exp").value); note("Đã sao chép mã."); }catch(e){ $("#exp").select(); note("Hãy nhấn giữ và sao chép mã trong ô trên.",true); } };
  $("#imb").onclick = () => {
    let arr, xs=[], ds=[], os={}, hs=[]; try{ const o=JSON.parse($("#imp").value); if(!o||typeof o!=="object") throw 0; arr=Array.isArray(o)?o:(Array.isArray(o.w)?o.w:[]); xs=(!Array.isArray(o)&&Array.isArray(o.e))?o.e:[]; ds=(!Array.isArray(o)&&Array.isArray(o.d))?o.d:[]; os=(!Array.isArray(o)&&o.o&&typeof o.o==="object")?o.o:{}; hs=(!Array.isArray(o)&&Array.isArray(o.h))?o.h.filter(x=>typeof x==="string"):[]; }catch(e){ note("Mã không hợp lệ. Hãy dán đúng mã giáo viên đã gửi.",true); return; }
    let n=0, nh=0;
    { const baseSet=new Set(); RAW.forEach(u=>u[1].split(";").forEach(p=>baseSet.add(p.split("|")[0]))); hs.forEach(x=>{ if(baseSet.has(x)&&!hid.includes(x)){ hid.push(x); nh++; } }); saveHid(); }
    arr.forEach(c=>{ if(c&&Number.isInteger(c.u)&&c.u>=0&&c.u<RAW.length&&typeof c.en==="string"&&typeof c.vi==="string"&&c.en.trim()&&c.vi.trim()&&!W.some(w=>w.en.toLowerCase()===c.en.trim().toLowerCase())){ custom.push({u:c.u,en:c.en.trim().slice(0,60),vi:c.vi.trim().slice(0,100),s:(typeof c.s==="string"&&c.s.includes("___"))?c.s.slice(0,200):undefined}); buildW(); n++; } });
    let nx=0;
    xs.forEach(x=>{ if(x&&Number.isInteger(x.u)&&x.u>=0&&x.u<RAW.length&&typeof x.s==="string"&&x.s.includes("___")&&typeof x.a==="string"&&x.a.trim()&&!exs.some(y=>y.s===x.s&&ak(y.a)===ak(x.a))){ exs.push({u:x.u,s:x.s.slice(0,200),a:x.a.trim().slice(0,60),h:typeof x.h==="string"?x.h.slice(0,100):""}); nx++; } });
    let nd=0;
    ds.forEach(d=>{ if(d&&Number.isInteger(d.u)&&d.u>=0&&d.u<RAW.length&&typeof d.t==="string"&&Array.isArray(d.l)&&d.l.length>=2&&d.l.length<=30&&d.l.every(x=>Array.isArray(x)&&x.length===3&&x.every(y=>typeof y==="string"))&&!dlgs.some(y=>y.u===d.u&&y.t===d.t)){ dlgs.push({u:d.u,t:d.t.slice(0,80),v:"",l:d.l.map(x=>x.map(y=>y.slice(0,200)))}); nd++; } });
    let no=0;
    Object.keys(os).forEach(key=>{ const m=key.match(/^b(\d+)$/), v=os[key]; if(!m||+m[1]>=DLG.length||!v) return;
      if(v.del===true){ dlgOv[key]={del:true}; no++; return; }
      if(Number.isInteger(v.u)&&v.u>=0&&v.u<RAW.length&&typeof v.t==="string"&&Array.isArray(v.l)&&v.l.length>=2&&v.l.length<=30&&v.l.every(x=>Array.isArray(x)&&x.length===3&&x.every(y=>typeof y==="string"))){ dlgOv[key]={u:v.u,t:v.t.slice(0,80),v:(typeof v.v==="string"?v.v.slice(0,80):""),l:v.l.map(x=>x.map(y=>y.slice(0,200)))}; no++; } });
    saveCustom(); saveEx(); saveDlg(); saveOv(); tmsg="Đã nhập "+n+" từ mới, ẩn "+nh+" từ có sẵn, "+nx+" bài tập, "+nd+" hội thoại và "+no+" chỉnh sửa hội thoại có sẵn."; teach();
  };
}if(ASSIGN){
  const D=ASSIGN.data||{};
  custom=Array.isArray(D.w)?D.w:[]; exs=Array.isArray(D.e)?D.e:[]; dlgs=Array.isArray(D.d)?D.d:[]; dlgOv=(D.o&&typeof D.o==="object")?D.o:{}; hid=Array.isArray(D.h)?D.h:[];
  buildW();
  sel.value=String(ASSIGN.unit); sel.style.display="none";
  const lb=document.querySelector('label[for="unit"]'); if(lb) lb.style.display="none";
  const sb=document.querySelector(".sub"); if(sb) sb.textContent=(ASSIGN.title||"Bài kiểm tra")+" – "+(ASSIGN.unit==="all"?"Tất cả các bài":RAW[ASSIGN.unit][0]);
}
start();
</script>
</body>
